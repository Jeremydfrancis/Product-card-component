<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="favicon_io/favicon-16x16.png"
    />
    <link rel="manifest" href="favicon_io/site.webmanifest" />
    <link rel="stylesheet" href="style.css" />
    <title>Jeremy Francis | Product preview card component</title>
  </head>
  <body>
    <main>
      <section class="card-parent">
        <div class="card-img">
          <img
            src="images/image-product-mobile.jpg"
            alt="Gabrielle Chanel Perfume"
            class="mobile-img general"
          />
          <img
            src="images/image-product-desktop.jpg"
            alt="Gabrielle Chanel Perfume"
            class="desktop-img general"
          />
        </div>

        <div class="card-content">
          <div>
            <p class="sub">Perfume</p>
          </div>
          <div>
            <h1>Gabrielle Essence Eau De Parfum</h1>
          </div>
          <div>
            <p class="para-content">
              A floral, solar and voluptuous interpretation composed by Olivier
              Polge, Perfumer-Creator for the House of CHANEL.
            </p>
          </div>
          <div class="prices">
            <h2><span class="best-price">$149.99</span></h2>
            <p><span class="mark-price">$169.99</span></p>
          </div>
          <div class="cta-btn">
            <button>
              <img
                src="images/icon-cart.svg"
                alt="Add items to cart button"
              />Add to Cart
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
